# Configuración de Netlify.
# Las funciones de la carpeta netlify/functions se publican automáticamente en
# https://TU-SITIO.netlify.app/.netlify/functions/<nombre-de-archivo>

[build]
  # Compila el dashboard de React (web/) a public/, que es lo que se publica.
  command = "npm run build"
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
